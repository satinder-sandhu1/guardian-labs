<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2172 724" role="img" aria-labelledby="title desc">
  <title id="title">Guardian Lab</title>
  <desc id="desc">Breaking AI Before It Breaks Free. Adversarial Science for the Control and Assurance of Machine Intelligence.</desc>
  <defs>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.45" stop-color="#d8d8d8"/>
      <stop offset="1" stop-color="#8d8d8d"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#20f0d0"/>
      <stop offset="0.5" stop-color="#8ffff0"/>
      <stop offset="1" stop-color="#20f0d0"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="2172" height="724" fill="#000"/>
  <text x="1086" y="285" text-anchor="middle" fill="url(#metal)" font-family="Arial Black, Arial, Helvetica, sans-serif" font-size="178" font-weight="900" letter-spacing="8">GUARDIAN LAB</text>
  <g stroke="url(#teal)" stroke-width="8" filter="url(#glow)">
    <line x1="533" y1="260" x2="533" y2="324"/>
    <line x1="1180" y1="260" x2="1180" y2="324"/>
    <line x1="1768" y1="260" x2="1768" y2="324"/>
  </g>
  <line x1="65" y1="401" x2="365" y2="401" stroke="url(#teal)" stroke-width="6"/>
  <line x1="1807" y1="401" x2="2107" y2="401" stroke="url(#teal)" stroke-width="6"/>
  <text x="1086" y="426" text-anchor="middle" fill="#f4f4f4" font-family="Arial, Helvetica, sans-serif" font-size="64" font-weight="600" letter-spacing="10">Breaking AI Before It Breaks Free.</text>
  <text x="1086" y="500" text-anchor="middle" fill="#e5e5e5" font-family="Arial, Helvetica, sans-serif" font-size="43" font-weight="400" letter-spacing="8">Adversarial Science for the Control and Assurance of Machine Intelligence.</text>
</svg>
